<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e9edf1;
    --panel: #ffffff;
    --ink: #1a2330;
    --muted: #5d6a7a;
    --line: #cfd7e0;
    --accent: #1f5fbf;
    --accent-ink: #ffffff;
    --code-bg: #f6f8fa;
    --ok: #17734a;      --ok-bg: #dcf3e7;
    --bad: #b02a2a;     --bad-bg: #fbe2e2;
    --warn: #8a5a00;    --warn-bg: #fdefc9;
    --err-text: #9c2323;
    --tk-kw: #7c3aed; --tk-str: #0a7c4f; --tk-com: #718096; --tk-num: #b45309; --tk-fn: #1f5fbf;
    --tk-ty: #0e7490; --tk-lit: #c2410c; --tk-pp: #be185d; --tk-var: #9a6700; --tk-tag: #be123c; --tk-attr: #0e7490;
    --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12181f;
      --panel: #1b232d;
      --ink: #e4e9ef;
      --muted: #93a1b2;
      --line: #2e3947;
      --accent: #5a9bff;
      --accent-ink: #0c1420;
      --code-bg: #141b23;
      --ok: #6fdba3;   --ok-bg: #173628;
      --bad: #ff8f8f;  --bad-bg: #3d1d1d;
      --warn: #f3c969; --warn-bg: #3a2e12;
      --err-text: #ff9d9d;
      --tk-kw: #b79cff; --tk-str: #7ee2a8; --tk-com: #7f8c9b; --tk-num: #f2b266; --tk-fn: #7db4ff;
      --tk-ty: #5fd3e6; --tk-lit: #ff9a6b; --tk-pp: #ff8fc0; --tk-var: #ffd27a; --tk-tag: #ff8a9e; --tk-attr: #5fd3e6;
    }
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 var(--sans);
    display: flex; flex-direction: column;
  }
  header { padding: 16px 24px 4px; }
  h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }

  main {
    flex: none; height: max(440px, calc(100vh - 100px));
    display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr);
    gap: 16px; padding: 12px 24px 24px;
  }
  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; grid-template-rows: none; height: auto; padding: 12px 12px 20px; }
    #history { margin: 0 12px 20px; }
    .hrow { grid-template-columns: 64px minmax(0, 1fr) auto; }
    .hlang { display: none; }
    header { padding: 14px 12px 0; }
  }
  section {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    display: flex; flex-direction: column; min-height: 320px; min-width: 0;
  }
  .bar {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  .bar .spacer { flex: 1; }
  label { font-size: 13px; color: var(--muted); }

  select, button {
    font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px;
  }
  select { min-width: 140px; cursor: pointer; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.run {
    background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
    font-weight: 600; padding: 7px 18px;
  }
  button.run:hover:not(:disabled) { filter: brightness(1.08); }
  button:disabled { opacity: .55; cursor: progress; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .editor { position: relative; flex: 1; min-height: 260px; background: var(--code-bg);
            border-radius: 0 0 8px 8px; overflow: hidden; }
  #hl, #code {
    position: absolute; inset: 0; margin: 0; width: 100%; height: 100%; border: 0; border-radius: 0;
    font: 14px/1.55 var(--mono); tab-size: 4; letter-spacing: 0; font-variant-ligatures: none;
    white-space: pre; word-wrap: normal; overflow-wrap: normal;
  }
  #hl { padding: 14px 32px 32px 14px; overflow: hidden; pointer-events: none; color: var(--ink); }
  #code { padding: 14px; resize: none; overflow: auto; background: transparent; color: transparent;
          caret-color: var(--ink); outline-offset: -2px; }
  #code::placeholder { color: var(--muted); }
  #code::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); }
  .tk-kw { color: var(--tk-kw); } .tk-str { color: var(--tk-str); }
  .tk-com { color: var(--tk-com); font-style: italic; } .tk-num { color: var(--tk-num); }
  .tk-fn { color: var(--tk-fn); } .tk-ty { color: var(--tk-ty); } .tk-lit { color: var(--tk-lit); }
  .tk-pp { color: var(--tk-pp); } .tk-var { color: var(--tk-var); }
  .tk-tag { color: var(--tk-tag); } .tk-attr { color: var(--tk-attr); }

  .attach { display: flex; align-items: center; gap: 8px; padding: 8px 12px; flex-wrap: wrap;
            border-bottom: 1px solid var(--line); font-size: 13px; }
  .attach.drop { background: var(--code-bg); outline: 2px dashed var(--accent); outline-offset: -4px; }
  .attach button { padding: 4px 10px; font-size: 13px; }
  .hint { color: var(--muted); }
  #chips { display: contents; }
  .chip-file { background: var(--code-bg); font: 12px var(--mono); }

  #history { min-height: 0; margin: 0 24px 28px; }
  .hist-head { display: flex; align-items: center; justify-content: space-between;
               padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .hist-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
  #hempty { margin: 0; padding: 14px 12px; }
  #hlist { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow: auto; }
  .hrow { display: grid; grid-template-columns: 72px 92px minmax(0, 1fr) auto; gap: 12px; align-items: center;
          width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line);
          border-radius: 0; padding: 9px 12px; background: transparent; }
  .hrow:hover { background: var(--code-bg); }
  .hcode { font: 13px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hwhen, .hlang { color: var(--muted); font-size: 13px; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 10px; }
  .chip.ok { background: var(--ok-bg); color: var(--ok); }
  .chip.bad { background: var(--bad-bg); color: var(--bad); }
  .chip.warn { background: var(--warn-bg); color: var(--warn); }

  #status {
    padding: 12px 14px; border-bottom: 1px solid var(--line);
    font-weight: 600; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
  }
  #status small { font-weight: 400; color: var(--muted); font-size: 13px; }
  #status.idle { color: var(--muted); font-weight: 400; }
  #status.ok  { background: var(--ok-bg);  color: var(--ok); }
  #status.bad { background: var(--bad-bg); color: var(--bad); }
  #status.warn{ background: var(--warn-bg);color: var(--warn); }
  #status.run { color: var(--accent); }

  #out { flex: 1; overflow: auto; padding: 12px 14px; }
  #out h2 { margin: 0 0 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
  #out h2:not(:first-child) { margin-top: 14px; }
  pre {
    margin: 0; padding: 10px 12px; background: var(--code-bg); border-radius: 6px;
    font: 13px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word;
  }
  pre.err { color: var(--err-text); }
  .empty { color: var(--muted); }
  #out.preview { padding: 0; display: flex; }
  #out iframe { flex: 1; width: 100%; min-height: 300px; border: 0; background: #fff;
                border-radius: 0 0 8px 8px; }
  textarea.drop { outline: 2px dashed var(--accent); outline-offset: -6px; }
</style>
</head>
<body>
<header>
  <h1>Docker</h1>
</header>

<main>
  <section aria-label="Редактор">
    <div class="bar">
      <label for="lang">Язык</label>
      <select id="lang"></select>
      <button id="memtest" type="button" title="Вставить программу, которая занимает всю память">Вставить тест памяти</button>
      <span class="spacer"></span>
      <button id="run" class="run" type="button">Запустить</button>
    </div>
    <div id="attach" class="attach">
      <button id="upload" type="button" title="Загрузить код из файла в редактор">Открыть код из файла</button>
      <input id="file" type="file" hidden
             accept=".py,.js,.mjs,.ts,.java,.c,.cpp,.cc,.go,.rs,.rb,.php,.sh,.html,.htm">
      <button id="attachBtn" type="button" title="Файлы и ZIP-архивы, которые программа сможет читать">Прикрепить файлы</button>
      <input id="files" type="file" multiple hidden>
      <span id="attachHint" class="hint">Перетащите сюда файлы или ZIP: они будут лежать рядом с программой</span>
      <span id="chips"></span>
    </div>
    <div class="editor">
      <pre id="hl" aria-hidden="true"></pre>
      <textarea id="code" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off"
                aria-label="Код программы" placeholder="Напишите код здесь или перетащите файл"></textarea>
    </div>
  </section>

  <section aria-label="Результат">
    <div id="status" class="idle">Нажмите «Запустить» или Ctrl + Enter</div>
    <div id="out"></div>
  </section>
</main>

<section id="history" aria-label="История запусков">
  <div class="hist-head">
    <h2>История запусков</h2>
    <button id="hclear" type="button" hidden>Очистить</button>
  </div>
  <p id="hempty" class="empty">Пока пусто. Здесь появятся ваши запуски.</p>
  <ul id="hlist"></ul>
</section>

<script>
const T = String.raw;

// Шаблоны "Hello, world" и программы, съедающие память
const HELLO = {
  python: T`print("Hello, world!")`,
  javascript: T`console.log("Hello, world!");`,
  typescript: T`const msg: string = "Hello, world!";
console.log(msg);`,
  java: T`public class Main {
    public static void main(String[] args) {
        System.out.println("Hello, world!");
    }
}`,
  c: T`#include <stdio.h>

int main(void) {
    printf("Hello, world!\n");
    return 0;
}`,
  cpp: T`#include <iostream>

int main() {
    std::cout << "Hello, world!" << std::endl;
    return 0;
}`,
  go: T`package main

import "fmt"

func main() {
	fmt.Println("Hello, world!")
}`,
  rust: T`fn main() {
    println!("Hello, world!");
}`,
  ruby: T`puts "Hello, world!"`,
  php: T`<?php
echo "Hello, world!" . PHP_EOL;`,
  bash: T`echo "Hello, world!"`,
  html: T`<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center;
         font-family: sans-serif; background: #f4f6f8; }
  h1 { color: #1f5fbf; }
</style>
</head>
<body>
  <h1>Привет, мир!</h1>
</body>
</html>`,
};

const MEMTEST = {
  python: T`data = []
while True:
    data.append(b"x" * 10_000_000)`,
  javascript: T`const data = [];
while (true) data.push(Buffer.alloc(10_000_000, 1));`,
  typescript: T`const data: Buffer[] = [];
while (true) data.push(Buffer.alloc(10_000_000, 1));`,
  java: T`import java.util.*;

public class Main {
    public static void main(String[] args) {
        List<byte[]> data = new ArrayList<>();
        while (true) data.add(new byte[10_000_000]);
    }
}`,
  c: T`#include <stdlib.h>
#include <string.h>

int main(void) {
    while (1) {
        char *p = malloc(10000000);
        memset(p, 1, 10000000);
    }
}`,
  cpp: T`#include <cstring>
#include <vector>

int main() {
    std::vector<char*> v;
    while (true) {
        char* p = new char[10000000];
        memset(p, 1, 10000000);
        v.push_back(p);
    }
}`,
  go: T`package main

func main() {
	var data [][]byte
	for {
		b := make([]byte, 10_000_000)
		for i := range b {
			b[i] = 1
		}
		data = append(data, b)
	}
}`,
  rust: T`fn main() {
    let mut data: Vec<Vec<u8>> = Vec::new();
    loop {
        data.push(vec![1u8; 10_000_000]);
    }
}`,
  ruby: T`data = []
loop { data << "x" * 10_000_000 }`,
  php: T`<?php
$data = [];
while (true) { $data[] = str_repeat("x", 10000000); }`,
  bash: T`x=a
while true; do x="$x$x"; done`,
};

const MESSAGES = {
  ok: ["Выполнено", "ok"],
  runtime_error: ["Программа завершилась с ошибкой", "bad"],
  compilation_error: ["Ошибка компиляции", "bad"],
  timeout: ["Остановлено: код работал дольше 10 секунд", "warn"],
  memory_limit_exceeded: ["Остановлено: код занял больше 256 МБ памяти", "warn"],
  internal_error: ["Ошибка песочницы", "bad"],
};

const $ = (id) => document.getElementById(id);
const langSel = $("lang"), codeBox = $("code"), runBtn = $("run");
const statusEl = $("status"), outEl = $("out");

// запомнить выбор между перезагрузками (если хранилище недоступно, просто работаем без него)
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

let lastTemplate = "";   // чтобы не затирать код, который пользователь уже правил

function setCode(text) { codeBox.value = text; lastTemplate = text; highlight(); }

function updateLangUi() {
  const isHtml = langSel.value === "html";
  $("memtest").disabled = isHtml;
  $("memtest").title = isHtml ? "Для HTML не нужен: страница выполняется в браузере"
                              : "Вставить программу, которая занимает всю память";
}

function onLangChange() {
  store.set("lang", langSel.value);
  updateLangUi();
  const current = codeBox.value.trim();
  const untouched = !current || current === lastTemplate.trim();
  if (untouched) setCode(HELLO[langSel.value] || "");
  highlight();
}

function setStatus(text, cls, extra) {
  statusEl.className = cls;
  statusEl.textContent = text;
  if (extra) { const s = document.createElement("small"); s.textContent = extra; statusEl.append(s); }
}

function block(title, text, cls) {
  const h = document.createElement("h2"); h.textContent = title;
  const p = document.createElement("pre"); p.textContent = text;
  if (cls) p.className = cls;
  outEl.append(h, p);
}

function showResult(r) {
  const [msg, cls] = MESSAGES[r.status] || [r.status, "bad"];
  const bits = [];
  if (r.time != null) bits.push(r.time + " с");
  if (r.exit_code != null) bits.push("код выхода " + r.exit_code);
  setStatus(msg, cls, bits.join(", "));

  outEl.replaceChildren();
  if (r.stdout) block("Вывод программы", r.stdout);
  if (r.stderr) block(r.status === "compilation_error" ? "Сообщения компилятора" : "Ошибки", r.stderr, "err");
  if (!r.stdout && !r.stderr) {
    const p = document.createElement("p"); p.className = "empty";
    p.textContent = "Программа ничего не вывела.";
    outEl.append(p);
  }
  if (r.truncated) {
    const p = document.createElement("p"); p.className = "empty";
    p.textContent = "Вывод слишком длинный и обрезан до 64 КБ.";
    outEl.append(p);
  }
}

function renderHtml() {
  const frame = document.createElement("iframe");
  frame.title = "Результат HTML";
  // без allow-same-origin страница не получает доступа к нашему сайту
  frame.setAttribute("sandbox", "allow-scripts allow-forms allow-modals");
  frame.srcdoc = codeBox.value;
  outEl.className = "preview";
  outEl.replaceChildren(frame);
  setStatus("Страница отрисована", "ok", "в браузере, не в Docker");
  addHistory("html");
}

async function run() {
  if (runBtn.disabled) return;
  if (langSel.value === "html") { renderHtml(); return; }
  outEl.className = "";
  runBtn.disabled = true;
  outEl.replaceChildren();
  setStatus("Запускаю…", "run");
  try {
    let files = [];
    if (attachments.length) {
      setStatus("Загружаю файлы…", "run");
      files = await Promise.all(attachments.map(async (f) => ({ name: f.name, data: await toB64(f) })));
    }
    const res = await fetch("/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ language: langSel.value, code: codeBox.value, files }),
    });
    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      const detail = typeof e.detail === "string" ? e.detail : "проверьте код и язык";
      setStatus("Запрос отклонён: " + detail, "bad");
      return;
    }
    const { id } = await res.json();
    for (;;) {
      const r = await (await fetch("/run/" + id)).json();
      if (r.state === "finished") { showResult(r); addHistory(r.status); break; }
      setStatus(r.state === "queued" ? "В очереди…" : "Выполняется…", "run");
      await new Promise((ok) => setTimeout(ok, 300));
    }
  } catch {
    setStatus("Нет связи с сервером. Проверьте, что бэкенд запущен.", "bad");
  } finally {
    runBtn.disabled = false;
  }
}

// Tab вставляет отступ вместо перехода фокуса
codeBox.addEventListener("keydown", (e) => {
  if (e.key === "Tab" && !e.shiftKey) {
    e.preventDefault();
    const { selectionStart: s, selectionEnd: en } = codeBox;
    codeBox.setRangeText("    ", s, en, "end");
    highlight();
  }
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); }
});

// ---------- подсветка синтаксиса (без внешних библиотек)
const W = (s) => new Set(s.split(" "));
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const sp = (c, t) => `<span class="tk-${c}">${esc(t)}</span>`;
const CL = {
  com: String.raw`\/\/[^\n]*|\/\*[\s\S]*?(?:\*\/|(?![\s\S]))`,
  str: String.raw`"(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?`,
};
const C_KW = "if else for while do switch case break continue return goto sizeof typedef struct union enum static const extern volatile register inline unsigned signed auto default";
const C_TY = "int char short long float double void size_t bool FILE printf scanf malloc free memset strlen";
const SPECS = {
  python: {
    com: String.raw`#[^\n]*`,
    str: String.raw`"""[\s\S]*?(?:"""|(?![\s\S]))|'''[\s\S]*?(?:'''|(?![\s\S]))|` + CL.str,
    pp: String.raw`@[A-Za-z_][\w.]*`,
    kw: "and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield",
    lit: "True False None",
    ty: "int str float list dict set tuple bool print len range open input type enumerate zip map filter sum min max abs sorted super self",
  },
  javascript: {
    com: CL.com, str: CL.str + "|`(?:\\\\.|[^`\\\\])*`?",
    kw: "const let var function return if else for while do switch case break continue new this class extends import export from default async await try catch finally throw typeof instanceof in of delete void yield static get set",
    lit: "true false null undefined NaN Infinity",
    ty: "console Math JSON Object Array String Number Boolean Promise Map Set Date Error Buffer require module process",
  },
  java: {
    ...CL, pp: String.raw`@[A-Za-z_]\w*`,
    kw: "abstract assert break case catch class continue default do else enum extends final finally for if implements import instanceof interface native new package private protected public return static super switch synchronized this throw throws try void volatile while",
    lit: "true false null",
    ty: "int long double float boolean char byte short String Integer List ArrayList Map HashMap Set Object System var",
  },
  c: {
    ...CL, pp: String.raw`(?<![^\n])[ \t]*#[ \t]*[a-z]+[^\n]*`,
    kw: C_KW, lit: "NULL true false", ty: C_TY,
  },
  go: {
    com: CL.com, str: CL.str + "|`[^`]*`?",
    kw: "break case chan const continue default defer else fallthrough for func go goto if import interface map package range return select struct switch type var",
    lit: "true false nil iota",
    ty: "int int8 int16 int32 int64 uint uint8 uint32 uint64 float32 float64 string bool byte rune error make len cap append copy delete new panic recover fmt",
  },
  rust: {
    com: CL.com, str: String.raw`"(?:\\.|[^"\\])*"?|'(?:\\.|[^'\\\n])'`,
    pp: String.raw`'[a-z_]\w*|#!?\[[^\]\n]*\]`, fn: String.raw`[A-Za-z_]\w*!(?=[(\[{])`,
    kw: "as break const continue crate else enum extern fn for if impl in let loop match mod move mut pub ref return self Self static struct super trait type unsafe use where while async await dyn",
    lit: "true false None Some Ok Err",
    ty: "i8 i16 i32 i64 u8 u16 u32 u64 usize isize f32 f64 bool char str String Vec Option Result Box",
  },
  ruby: {
    com: String.raw`#[^\n]*`, str: CL.str, var: String.raw`:[A-Za-z_]\w*|@@?[A-Za-z_]\w*|\$[A-Za-z_]\w*`,
    kw: "alias and begin break case class def do else elsif end ensure for if in module next not or redo rescue retry return self super then undef unless until when while yield",
    lit: "true false nil", ty: "puts print require attr_accessor p lambda proc",
  },
  php: {
    com: CL.com + String.raw`|#[^\n]*`, str: CL.str, var: String.raw`\$[A-Za-z_]\w*`, pp: String.raw`<\?php|\?>`,
    kw: "abstract and as break case catch class clone const continue declare default do echo else elseif extends final finally fn for foreach function global if implements include include_once instanceof interface namespace new or print private protected public require require_once return static switch throw trait try use var while yield",
    lit: "true false null TRUE FALSE NULL", ty: "array isset empty count strlen str_repeat var_dump PHP_EOL",
  },
  bash: {
    com: String.raw`(?<![^\s])#[^\n]*`, str: CL.str,
    var: String.raw`\$(?:\{[^}\n]*\}|[A-Za-z_]\w*|[0-9@#?$!*])`,
    kw: "if then else elif fi for while until do done case esac in function select return exit break continue local export readonly declare",
    ty: "echo cd ls cat grep sed awk read printf test source set unset",
  },
  css: {
    com: String.raw`\/\*[\s\S]*?(?:\*\/|(?![\s\S]))`, str: CL.str,
    pp: String.raw`@[\w-]+|!important`, var: String.raw`#[0-9a-fA-F]{3,8}\b`, fn: String.raw`[A-Za-z-]+(?=\()`,
    extra: [["tag", String.raw`[.#][A-Za-z_][\w-]*`], ["attr", String.raw`[A-Za-z-]+(?=\s*:(?!:))`]],
  },
};
SPECS.typescript = {
  ...SPECS.javascript,
  kw: SPECS.javascript.kw + " interface type enum implements public private protected readonly as namespace declare abstract",
  ty: SPECS.javascript.ty + " string number boolean any never unknown",
};
SPECS.cpp = {
  ...SPECS.c,
  kw: C_KW + " class public private protected namespace using template typename new delete this virtual override final constexpr try catch throw operator",
  lit: "NULL true false nullptr", ty: C_TY + " std string vector map set cout cin endl unique_ptr",
};

const compiled = {};
function compile(lang) {
  const o = SPECS[lang];
  const rules = [["com", o.com], ["str", o.str], ["pp", o.pp], ["var", o.var], ["fn", o.fn],
    ...(o.extra || []),
    ["num", String.raw`\b\d[\d_]*(?:\.\d+)?(?:[eE][+-]?\d+)?(?:[A-Za-z]\w*)?\b`],
    ["word", String.raw`[A-Za-z_$][\w$]*`]].filter((r) => r[1]);
  return { rules, re: new RegExp(rules.map((r) => "(" + r[1] + ")").join("|"), "g"),
           kw: W(o.kw || ""), lit: W(o.lit || ""), ty: W(o.ty || "") };
}

function hlCode(code, lang) {
  const spec = compiled[lang] = compiled[lang] || compile(lang);
  let out = "", last = 0;
  for (const m of code.matchAll(spec.re)) {
    out += esc(code.slice(last, m.index));
    last = m.index + m[0].length;
    const kind = spec.rules[m.findIndex((g, i) => i > 0 && g !== undefined) - 1][0];
    let cls = kind;
    if (kind === "word") {
      const w = m[0];
      cls = spec.kw.has(w) ? "kw" : spec.lit.has(w) ? "lit" : spec.ty.has(w) ? "ty"
          : code[last] === "(" ? "fn" : /^[A-Z]/.test(w) ? "ty" : null;
    }
    out += cls ? sp(cls, m[0]) : esc(m[0]);
  }
  return out + esc(code.slice(last));
}

function hlTag(t) {
  const m = /^(<\/?)([A-Za-z][\w:-]*)([\s\S]*?)(\/?>?)$/.exec(t);
  if (!m) return esc(t);
  const attrs = m[3].replace(/([\w:@.-]+)|("[^"]*"?|'[^']*'?)|([\s\S])/g,
    (_, a, s, o) => (a ? sp("attr", a) : s ? sp("str", s) : esc(o)));
  return esc(m[1]) + sp("tag", m[2]) + attrs + esc(m[4]);
}

function hlHtml(code) {
  let out = "", last = 0;
  const re = /<!--[\s\S]*?(?:-->|(?![\s\S]))|<(style|script)\b[^>]*>[\s\S]*?(?:<\/\1\s*>|(?![\s\S]))|<\/?[A-Za-z][^>]*>?/gi;
  for (const m of code.matchAll(re)) {
    out += esc(code.slice(last, m.index));
    last = m.index + m[0].length;
    if (m[0].startsWith("<!--")) out += sp("com", m[0]);
    else if (m[1]) {
      const open = /^<[^>]*>/.exec(m[0])[0];
      const close = /<\/[a-z]+\s*>$/i.exec(m[0]);
      const inner = m[0].slice(open.length, close ? m[0].length - close[0].length : m[0].length);
      out += hlTag(open) + hlCode(inner, m[1].toLowerCase() === "style" ? "css" : "javascript")
           + (close ? hlTag(close[0]) : "");
    } else out += hlTag(m[0]);
  }
  return out + esc(code.slice(last));
}

const hlEl = $("hl");
function syncScroll() { hlEl.scrollTop = codeBox.scrollTop; hlEl.scrollLeft = codeBox.scrollLeft; }
function highlight() {
  const lang = langSel.value, code = codeBox.value;
  hlEl.innerHTML = (lang === "html" ? hlHtml(code) : SPECS[lang] ? hlCode(code, lang) : esc(code)) + "\n";
  syncScroll();
}
codeBox.addEventListener("input", highlight);
codeBox.addEventListener("scroll", syncScroll);

// ---------- прикреплённые файлы
const MAX_UPLOAD = 50 * 1024 * 1024;
let attachments = [];
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
const fmtSize = (n) => (n < 1024 ? n + " Б" : n < 1048576 ? Math.round(n / 1024) + " КБ" : (n / 1048576).toFixed(1) + " МБ");

function renderChips() {
  const box = $("chips");
  box.replaceChildren();
  for (const f of attachments) {
    const b = el("button", "chip-file", f.name + " · " + fmtSize(f.size) + "  ×");
    b.type = "button";
    b.title = "Убрать файл";
    b.addEventListener("click", () => { attachments = attachments.filter((x) => x !== f); renderChips(); });
    box.append(b);
  }
  $("attachHint").hidden = attachments.length > 0;
}

function attach(fileList) {
  const files = [...fileList];
  const keep = attachments.filter((a) => !files.some((f) => f.name === a.name));
  if ([...keep, ...files].reduce((s, f) => s + f.size, 0) > MAX_UPLOAD) {
    setStatus("Файлы больше " + fmtSize(MAX_UPLOAD) + ": уберите лишнее", "bad");
    return;
  }
  attachments = keep.concat(files);
  renderChips();
  if (langSel.value === "html") setStatus("В режиме HTML прикреплённые файлы не используются", "warn");
}

const toB64 = (file) => new Promise((ok, fail) => {
  const r = new FileReader();
  r.onload = () => ok(String(r.result).split(",")[1] || "");
  r.onerror = () => fail(r.error);
  r.readAsDataURL(file);
});

$("attachBtn").addEventListener("click", () => $("files").click());
$("files").addEventListener("change", (e) => { attach(e.target.files); e.target.value = ""; });
const strip = $("attach");
strip.addEventListener("dragover", (e) => { e.preventDefault(); strip.classList.add("drop"); });
strip.addEventListener("dragleave", () => strip.classList.remove("drop"));
strip.addEventListener("drop", (e) => { e.preventDefault(); strip.classList.remove("drop"); attach(e.dataTransfer.files); });

// ---------- история запусков
const HKEY = "history", HMAX = 30;
let runs = [];
try { runs = JSON.parse(store.get(HKEY) || "[]"); } catch {}
const SHORT = { ok: "ok", html: "html", runtime_error: "ошибка", compilation_error: "компиляция",
                timeout: "таймаут", memory_limit_exceeded: "память", internal_error: "сбой" };

function saveHistory() {
  for (let n = runs.length; n >= 0; n--) {   // если место кончилось, выкидываем самые старые
    try { localStorage.setItem(HKEY, JSON.stringify(runs.slice(0, n))); return; } catch {}
  }
}

function addHistory(status) {
  runs.unshift({ t: Date.now(), lang: langSel.value, code: codeBox.value, status,
                 files: status === "html" ? [] : attachments.map((f) => f.name) });
  runs = runs.slice(0, HMAX);
  saveHistory();
  renderHistory();
}

function restore(h) {
  if ([...langSel.options].some((o) => o.value === h.lang)) langSel.value = h.lang;
  store.set("lang", langSel.value);
  updateLangUi();
  setCode(h.code);
  lastTemplate = "";
  outEl.className = "";
  outEl.replaceChildren();
  setStatus("Код из истории возвращён" +
    (h.files.length ? ". Файлы (" + h.files.join(", ") + ") нужно прикрепить заново" : ""), "idle");
  codeBox.focus();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderHistory() {
  const list = $("hlist");
  list.replaceChildren();
  $("hempty").hidden = runs.length > 0;
  $("hclear").hidden = runs.length === 0;
  for (const h of runs) {
    const d = new Date(h.t);
    const when = d.toDateString() === new Date().toDateString()
      ? d.toLocaleTimeString("ru-RU")
      : d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" });
    const first = h.code.split("\n").find((l) => l.trim()) || "(пусто)";
    const cls = h.status === "html" ? "ok" : (MESSAGES[h.status] || [0, "bad"])[1];
    const b = el("button", "hrow");
    b.type = "button";
    b.title = "Вернуть этот код в редактор";
    b.append(el("span", "hwhen", when), el("span", "hlang", h.lang),
             el("span", "hcode", first + (h.files.length ? "    +" + h.files.length + " файл." : "")),
             el("span", "chip " + cls, SHORT[h.status] || h.status));
    b.addEventListener("click", () => restore(h));
    const li = document.createElement("li");
    li.append(b);
    list.append(li);
  }
}
$("hclear").addEventListener("click", () => {
  if (confirm("Очистить историю запусков?")) { runs = []; saveHistory(); renderHistory(); }
});

const EXT = { py: "python", js: "javascript", mjs: "javascript", ts: "typescript",
  java: "java", c: "c", cpp: "cpp", cc: "cpp", go: "go", rs: "rust", rb: "ruby",
  php: "php", sh: "bash", html: "html", htm: "html" };
const MAX_CHARS = 50000;

async function loadFile(file) {
  if (!file) return;
  outEl.className = "";
  outEl.replaceChildren();
  const ext = file.name.includes(".") ? file.name.split(".").pop().toLowerCase() : "";
  const lang = EXT[ext];
  if (!lang) { setStatus("Не знаю, что за язык у файла «" + file.name + "»", "bad"); return; }
  if (![...langSel.options].some((o) => o.value === lang)) {
    setStatus("Сервер не поддерживает язык " + lang, "bad"); return;
  }
  const text = await file.text();
  if (lang !== "html" && text.length > MAX_CHARS) {
    setStatus("Файл слишком большой: максимум " + MAX_CHARS + " символов", "bad"); return;
  }
  langSel.value = lang;
  store.set("lang", lang);
  updateLangUi();
  setCode(text);
  lastTemplate = "";
  setStatus("Загружен файл " + file.name, "idle");
}

$("upload").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", (e) => { loadFile(e.target.files[0]); e.target.value = ""; });
codeBox.addEventListener("dragover", (e) => { e.preventDefault(); codeBox.classList.add("drop"); });
codeBox.addEventListener("dragleave", () => codeBox.classList.remove("drop"));
codeBox.addEventListener("drop", (e) => {
  e.preventDefault();
  codeBox.classList.remove("drop");
  loadFile(e.dataTransfer.files[0]);
});

runBtn.addEventListener("click", run);
langSel.addEventListener("change", onLangChange);
$("memtest").addEventListener("click", () => setCode(MEMTEST[langSel.value] || ""));

async function init() {
  let langs = Object.keys(HELLO);
  try {
    const r = await fetch("/languages");
    if (r.ok) langs = await r.json();
  } catch {}
  if (!langs.includes("html")) langs.push("html");
  for (const l of langs) langSel.add(new Option(l, l));
  const saved = store.get("lang");
  langSel.value = langs.includes(saved) ? saved : langs[0];
  setCode(HELLO[langSel.value] || "");
  updateLangUi();
  highlight();
  renderHistory();
  renderChips();
}
init();
</script>
